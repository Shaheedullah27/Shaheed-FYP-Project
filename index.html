<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI ResumeMatch — Compare a Resume with a Job Posting</title>
    <meta name="description" content="Compare a resume with a job posting, see which skills match, and get clear suggestions for improving the resume." />
    <meta property="og:title" content="AI ResumeMatch — Compare a Resume with a Job Posting" />
    <meta property="og:description" content="Compare a resume with a job posting, see which skills match, and get clear suggestions for improving the resume." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var savedTheme = localStorage.getItem('resume-match-theme');
        document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body class="bg-obsidian text-porcelain antialiased font-sans selection:bg-mint/25 selection:text-porcelain">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
